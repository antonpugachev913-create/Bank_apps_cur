[project]
name = "bank-app-curs"
version = "0.1.0"
description = ""
authors = [
    {name = "Pugachev Anton"}

]
package-mode = false
requires-python = ">=3.13"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "black (>=26.10.1,<27.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "ruff (>=0.17.1,<0.18.0)"
]

[tool.black]
line-length = 88

[tool.isort]
line_length = 88

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

ignore = ["E203"]
